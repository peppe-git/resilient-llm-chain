# SPDX-License-Identifier: Apache-2.0
#
# Publishes a release to Maven Central. Runs on a pushed tag v<version> (or by hand on a tag).
# The upload ends in the Central Publisher Portal as a validated deployment: autoPublish is false,
# so nothing is public until a maintainer presses "Publish" there. See RELEASING.md.
#
# Repository secrets used, and nothing else:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  user token of the Central Publisher Portal
#   GPG_PRIVATE_KEY                                 ASCII-armored secret key used to sign
#   GPG_PASSPHRASE                                  its passphrase
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the version matches the tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow from a tag v<version>, not from '$GITHUB_REF_NAME'"
            exit 1
          fi
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          tag = sys.argv[1]
          version = ET.parse("pom.xml").getroot().findtext("m:version", namespaces=ns)
          problems = []
          if version is None:
              problems.append("pom.xml has no version")
          elif version.endswith("-SNAPSHOT"):
              problems.append(f"pom.xml version {version} is a snapshot")
          elif tag != "v" + version:
              problems.append(f"tag {tag} does not match pom.xml version {version}")
          for module in ["core", "redis", "openai-compatible"]:
              parent = ET.parse(f"{module}/pom.xml").getroot().findtext("m:parent/m:version", namespaces=ns)
              if parent != version:
                  problems.append(f"{module}/pom.xml points to parent version {parent}, not {version}")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Scrub check
        run: ./scripts/scrub-check.sh

      - name: Set up Java 21, Central credentials and the signing key
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Build, sign and upload to the Central Publisher Portal
        run: ./mvnw -B --no-transfer-progress -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
